services:
  hub:
    image: node:22-bookworm
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-c", "corepack enable && yarn install --frozen-lockfile --production=false && npx prisma generate && npx prisma migrate deploy && yarn build && yarn start"]
    env_file:
      - ${SHARED_ENV_FILE:-../../.env.shared}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${HUB_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      URANTIA_DEV_API_INTERNAL_HOST: http://api:3000
      NEXT_PUBLIC_URANTIA_DEV_API_HOST: ${NEXT_PUBLIC_URANTIA_DEV_API_HOST}
      NEXT_PUBLIC_HOST: ${NEXT_PUBLIC_HOST}
      NEXT_PUBLIC_AUDIO_FILES_CDN: ${NEXT_PUBLIC_AUDIO_FILES_CDN}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_ENABLED: ${AUTH_ENABLED:-}
      NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-}
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    volumes:
      - ${HUB_ROOT}:/app
      - hub_node_modules:/app/node_modules
      - hub_next:/app/.next
    networks:
      - apps
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 420s

volumes:
  hub_node_modules: {}
  hub_next: {}

networks:
  apps:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-apps
    external: true
  backend:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-backend
    external: true
