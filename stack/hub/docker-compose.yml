services:
  hub:
    image: ${COMPOSE_PROJECT_NAME:-urantialab}-hub:local
    build:
      context: ${HUB_ROOT}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_URANTIA_DEV_API_HOST: ${NEXT_PUBLIC_URANTIA_DEV_API_HOST}
        NEXT_PUBLIC_HOST: ${NEXT_PUBLIC_HOST}
        NEXT_PUBLIC_AUDIO_FILES_CDN: ${NEXT_PUBLIC_AUDIO_FILES_CDN}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
    restart: unless-stopped
    env_file:
      - ${SHARED_ENV_FILE:-../../.env.shared}
    environment:
      NODE_ENV: production
      DATABASE_URL: ""
      REDIS_URL: ""
      HUB_DATABASE_URL: ""
      PAPERS_DATABASE_URL: ""
      URANTIA_DEV_API_INTERNAL_HOST: http://api:3000
      NEXT_PUBLIC_URANTIA_DEV_API_HOST: ${NEXT_PUBLIC_URANTIA_DEV_API_HOST}
      NEXT_PUBLIC_HOST: ${NEXT_PUBLIC_HOST}
      NEXT_PUBLIC_AUDIO_FILES_CDN: ${NEXT_PUBLIC_AUDIO_FILES_CDN}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    # Apps only. Papers via API on apps. Do not join backend.
    # Blank DATABASE_URL / REDIS_URL so .env.shared cannot leak backend DNS.
    # yarn start: image CMD prisma migrate deploy needs postgres.
    command: ["yarn", "start"]
    networks:
      - apps
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 90s

networks:
  apps:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-apps
    external: true
