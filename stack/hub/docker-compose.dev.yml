services:
  hub:
    image: node:22-bookworm
    working_dir: /app
    command: ["sh", "-c", "corepack enable && yarn install --frozen-lockfile && npx prisma generate && yarn dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ${HUB_ROOT}:/app
      - hub_node_modules:/app/node_modules
    ports:
      - "${HUB_HOST_PORT:-3001}:3001"

volumes:
  hub_node_modules: {}
