services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env
      - ${SHARED_ENV_FILE:-../../.env.shared}
    environment:
      CADDY_API_PATH: ${CADDY_API_PATH:-/dev-api}
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - apps
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1$${CADDY_API_PATH}/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

configs:
  caddyfile:
    content: |
      {
      	auto_https off
      }

      (urantia_edge) {
      	encode zstd gzip

      	redir /dev-api /dev-api/
      	handle_path /dev-api* {
      		reverse_proxy api:3000 {
      			header_up X-Forwarded-Proto https
      			header_up X-Forwarded-Host {host}
      		}
      	}

      	handle {
      		reverse_proxy hub:3001 {
      			flush_interval -1
      			header_up X-Forwarded-Proto https
      			header_up X-Forwarded-Host {host}
      		}
      	}
      }

      :80 {
      	import urantia_edge
      }

volumes:
  caddy-data:
  caddy-config:

networks:
  apps:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-apps
    external: true
