services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env
      - ${SHARED_ENV_FILE:-../../.env.shared}
    environment:
      CADDY_API_PATH: ${CADDY_API_PATH:-/dev-api}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-8080}
      CADDY_HOST_MATCHERS: "${CADDY_HOST_MATCHERS:-localhost localhost:8080 127.0.0.1 127.0.0.1:8080}"
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:-localhost}
      EDGE_FORWARDED_PROTO: ${EDGE_FORWARDED_PROTO:-http}
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - apps
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1$${CADDY_API_PATH}/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  caddy-data:
  caddy-config:

networks:
  apps:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-apps
    external: true
