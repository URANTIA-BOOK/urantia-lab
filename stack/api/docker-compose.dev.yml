services:
  api:
    image: oven/bun:1.2
    working_dir: /app
    command: ["sh", "-c", "bun install && bun run dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ${API_ROOT}:/app
      - ${PIPELINE_ROOT}/source:/book/eng:ro
      - ${PIPELINE_ROOT}/langs:/book/langs:ro
      - api_node_modules:/app/node_modules
      - api_bun_cache:/root/.bun
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    networks:
      - apps
      - backend
      - dev

volumes:
  api_node_modules: {}
  api_bun_cache: {}

networks:
  apps:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-apps
    external: true
  backend:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-backend
    external: true
  dev:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-dev

