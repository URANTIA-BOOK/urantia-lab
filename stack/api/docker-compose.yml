services:
  api:
    image: ${COMPOSE_PROJECT_NAME:-urantialab}-api:local
    build:
      context: ${API_ROOT}
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${SHARED_ENV_FILE:-../../.env.shared}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${PAPERS_DATABASE_URL}
      BOOK_TREE: /book/eng
      PORT: "3000"
    volumes:
      - ${PIPELINE_ROOT}/source:/book/eng:ro
      - ${PIPELINE_ROOT}/langs:/book/langs:ro
    networks:
      - apps
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

networks:
  apps:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-apps
    external: true
  backend:
    name: ${COMPOSE_PROJECT_NAME:-urantialab}-backend
    external: true
